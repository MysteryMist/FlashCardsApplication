name: Android APK Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install maui-android

      - name: Derive app version from tag
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
            throw "Release tag '$tag' must use the format vMAJOR.MINOR.PATCH, for example v2.1.0."
          }

          $displayVersion = $Matches.version
          $versionCode = [int]$env:GITHUB_RUN_NUMBER + 1
          "display=$displayVersion" >> $env:GITHUB_OUTPUT
          "code=$versionCode" >> $env:GITHUB_OUTPUT

      - name: Prepare Android signing key
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) {
            throw 'Configure the ANDROID_KEYSTORE_BASE64 repository secret with the Base64-encoded release keystore.'
          }

          $keystorePath = Join-Path $env:RUNNER_TEMP 'android-release.keystore'
          $keystoreBytes = [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64)
          [System.IO.File]::WriteAllBytes($keystorePath, $keystoreBytes)
          "ANDROID_KEYSTORE_PATH=$keystorePath" >> $env:GITHUB_ENV

      - name: Build signed APK
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dotnet publish FlashCardsApp/FlashCardsApp.csproj `
            -f net10.0-android `
            -c Release `
            -p:ApplicationDisplayVersion=${{ steps.version.outputs.display }} `
            -p:ApplicationVersion=${{ steps.version.outputs.code }} `
            -p:AndroidPackageFormat=apk `
            -p:AndroidKeyStore=true `
            "-p:AndroidSigningKeyStore=$env:ANDROID_KEYSTORE_PATH" `
            "-p:AndroidSigningKeyAlias=$env:ANDROID_KEY_ALIAS" `
            "-p:AndroidSigningStorePass=$env:ANDROID_KEYSTORE_PASSWORD" `
            "-p:AndroidSigningKeyPass=$env:ANDROID_KEY_PASSWORD"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Locate APK
        id: package
        shell: pwsh
        run: |
          $apk = Get-ChildItem 'FlashCardsApp/bin/Release/net10.0-android/publish' -Filter '*-Signed.apk' -Recurse | Select-Object -First 1
          if ($null -eq $apk) {
            throw 'The signed APK was not found in the publish output.'
          }

          $releaseApk = Join-Path $env:RUNNER_TEMP "FlashCardsApp-v${{ steps.version.outputs.display }}.apk"
          Copy-Item $apk.FullName $releaseApk -Force
          "path=$releaseApk" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.package.outputs.path }}
